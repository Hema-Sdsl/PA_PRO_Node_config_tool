<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>PA PRO Node Config</title>
<style>
  :root {
    --background: #0d1117;
    --panel: #161b22;
    --panel-border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #2f81f7;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --selected: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--background);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  button {
    font: inherit;
    border: 1px solid var(--panel-border);
    background: #21262d;
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.success { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  input, select {
    font: inherit;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--background);
    color: var(--text);
  }
  label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  .value-box {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 18px;
    padding: 10px;
    border-radius: 8px;
    background: var(--background);
    border: 1px dashed var(--panel-border);
    text-align: center;
    margin-top: 8px;
  }
  .value-box.ok { border-style: solid; border-color: var(--success); color: var(--success); }
  .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zone-grid button { padding: 16px 8px; font-weight: 600; }
  .zone-grid button .zone-byte { display: block; font-size: 12px; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
  .zone-grid button.selected { background: var(--selected); border-color: var(--selected); color: #fff; }
  .zone-grid button.selected .zone-byte { color: #cfe3ff; }
  #cameraBox { display: none; margin-top: 10px; position: relative; }
  #cameraBox video { width: 100%; border-radius: 10px; background: #000; }
  #cameraBox .scan-frame {
    position: absolute;
    inset: 15%;
    border: 3px solid var(--success);
    border-radius: 12px;
    pointer-events: none;
  }
  .status-line { font-size: 14px; margin-top: 8px; color: var(--text-muted); }
  .status-line.ok { color: var(--success); }
  .status-line.error { color: var(--danger); }
  .status-line.warning { color: var(--warning); }
  .node-status {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-size: 14px;
    margin-top: 10px;
  }
  .node-status span:nth-child(odd) { color: var(--text-muted); }
  .node-status span:nth-child(even) { font-family: ui-monospace, Menlo, Consolas, monospace; }
  #logBox {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--background);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px;
    height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-sent { color: #79c0ff; }
  .log-received { color: #7ee787; }
  .log-error { color: var(--danger); }
</style>
</head>
<body>

<h1>PA PRO Node Config</h1>
<div class="subtitle">Scan the master QR code, pick the node zone, connect the node over USB, configure.</div>

<!-- ======================= STEP 1: MASTER MAC ADDRESS ======================= -->
<div class="card">
  <h2><span class="step-number">1</span>Master MAC address</h2>
  <button id="checkMacButton" class="primary">Check MAC ID</button>

  <div id="cameraBox">
    <video id="cameraVideo" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="row"><button id="stopCameraButton">Cancel scan</button></div>
  </div>

  <div id="masterMacBox" class="value-box">Not scanned</div>

  <label for="manualMacInput">Or type it (AA:BB:CC:DD:EE:FF)</label>
  <div class="row">
    <input id="manualMacInput" placeholder="AA:BB:CC:DD:EE:FF" autocapitalize="characters" autocomplete="off">
    <button id="manualMacButton" style="flex: 0 0 80px;">Use</button>
  </div>
</div>

<!-- ======================= STEP 2: ZONE ======================= -->
<div class="card">
  <h2><span class="step-number">2</span>Node zone</h2>
  <div class="zone-grid">
    <button data-zone-byte="1">On side<span class="zone-byte">byte 0x01</span></button>
    <button data-zone-byte="2">Off side<span class="zone-byte">byte 0x02</span></button>
    <button data-zone-byte="4">Four<span class="zone-byte">byte 0x04</span></button>
    <button data-zone-byte="6">Six<span class="zone-byte">byte 0x06</span></button>
  </div>
</div>

<!-- ======================= STEP 3: LINK SETTINGS ======================= -->
<div class="card">
  <h2><span class="step-number">3</span>Link settings</h2>
  <label for="channelSelect">ESP-NOW channel (must match the master)</label>
  <select id="channelSelect"></select>

  <label for="surfaceSelect">Mount type</label>
  <select id="surfaceSelect">
    <option value="board">Board (always powered, ring LED)</option>
    <option value="net">Net (battery, deep sleep)</option>
  </select>
</div>

<!-- ======================= STEP 4: CONNECT AND CONFIGURE ======================= -->
<div class="card">
  <h2><span class="step-number">4</span>Node</h2>
  <div class="row" style="margin-top: 0;">
    <button id="connectButton" class="primary">Connect node</button>
    <button id="disconnectButton" disabled>Disconnect</button>
  </div>
  <div id="connectionStatus" class="status-line">Not connected. Plug the node into the phone with a USB OTG cable.</div>

  <div id="nodeStatus" class="node-status" style="display: none;"></div>

  <div class="row">
    <button id="readStatusButton" disabled>Read node status</button>
  </div>
  <div class="row">
    <button id="configureButton" class="success" disabled>Configure node</button>
  </div>
  <div id="configureStatus" class="status-line"></div>
</div>

<!-- ======================= LOG ======================= -->
<div class="card">
  <h2>Log</h2>
  <div id="logBox"></div>
</div>

<script>
"use strict";

/* ==========================================================================
 *                               CONSTANTS
 * ========================================================================== */

const ESPRESSIF_USB_VENDOR_ID  = 0x303A;    /* USB vendor ID of every Espressif chip.            */
const CDC_DATA_INTERFACE_CLASS = 0x0A;      /* USB class of the CDC data interface.              */
const USB_READ_CHUNK_BYTES     = 64;        /* Bytes asked for in each USB bulk read.            */
const SERIAL_BAUD_RATE         = 115200;    /* Ignored by USB-Serial/JTAG, required by the API.  */
const REPLY_TIMEOUT_MILLISECONDS = 2000;    /* Longest wait for one "OK ..." / "ERR ..." reply.  */
const CHANNEL_MIN = 1;                      /* Lowest ESP-NOW channel.                           */
const CHANNEL_MAX = 13;                     /* Highest ESP-NOW channel.                          */

const ZONE_NAMES = { 1: "On side", 2: "Off side", 4: "Four", 6: "Six" };

/* ==========================================================================
 *                                 STATE
 * ========================================================================== */

let masterMacAddress  = null;   /* "AA:BB:CC:DD:EE:FF" once scanned or typed.  */
let selectedZoneByte  = null;   /* 1, 2, 4 or 6 once a zone button is pressed. */
let nodeTransport     = null;   /* The open USB / serial link, or null.        */
let receiveTextBuffer = "";     /* Bytes from the node not yet ended by '\n'.  */
let lineWaiters       = [];     /* Promises waiting for a reply line.          */
let cameraStream      = null;   /* Live camera stream while scanning.          */
let scanIsRunning     = false;  /* true while the QR scan loop runs.           */

/* ==========================================================================
 *                             SMALL HELPERS
 * ========================================================================== */

const element = (id) => document.getElementById(id);

function Log(text, kind)
{
    const logBox = element("logBox");
    const line   = document.createElement("div");

    line.textContent = text;
    if (kind) { line.className = "log-" + kind; }

    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
}

function SetStatus(id, text, kind)
{
    const statusElement = element(id);
    statusElement.textContent = text;
    statusElement.className   = "status-line" + (kind ? " " + kind : "");
}

/* Browser storage can be blocked (private mode), so every access is guarded. */
function StorageGet(storage, key)
{
    try { return storage.getItem(key); } catch (error) { return null; }
}

function StorageSet(storage, key, value)
{
    try { storage.setItem(key, value); } catch (error) { /* Not critical. */ }
}

/* Find a MAC address anywhere in a text: "AA:BB:..", "AA-BB-..", or 12 hex digits. */
function ExtractMacAddress(text)
{
    const separated = text.match(/([0-9A-Fa-f]{2})[:-]([0-9A-Fa-f]{2})[:-]([0-9A-Fa-f]{2})[:-]([0-9A-Fa-f]{2})[:-]([0-9A-Fa-f]{2})[:-]([0-9A-Fa-f]{2})/);

    if (separated)
    {
        return separated.slice(1, 7).join(":").toUpperCase();
    }

    const plain = text.match(/\b([0-9A-Fa-f]{12})\b/);

    if (plain)
    {
        return plain[1].match(/../g).join(":").toUpperCase();
    }

    return null;
}

function UpdateButtons()
{
    const isConnected = (nodeTransport !== null);

    element("connectButton").disabled    = isConnected;
    element("disconnectButton").disabled = !isConnected;
    element("readStatusButton").disabled = !isConnected;
    element("configureButton").disabled  = !(isConnected && masterMacAddress && selectedZoneByte);
}

/* ==========================================================================
 *                        STEP 1: MASTER MAC ADDRESS
 * ========================================================================== */

function SetMasterMacAddress(macAddress, source)
{
    masterMacAddress = macAddress;

    const macBox = element("masterMacBox");
    macBox.textContent = macAddress;
    macBox.className   = "value-box ok";

    /* Temporary store: survives a page reload, cleared when the tab closes. */
    StorageSet(sessionStorage, "masterMacAddress", macAddress);

    Log("Master MAC address " + macAddress + " (" + source + ")");
    UpdateButtons();
}

/* jsQR is loaded only if the browser has no built-in BarcodeDetector. */
function LoadJsQrLibrary()
{
    return new Promise((resolve, reject) =>
    {
        if (window.jsQR) { resolve(); return; }

        const script   = document.createElement("script");
        script.src     = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
        script.onload  = () => resolve();
        script.onerror = () => reject(new Error("Could not load the QR decoder"));
        document.head.appendChild(script);
    });
}

async function StartQrScan()
{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    {
        alert("Camera is not available. Open this page over https in Chrome.");
        return;
    }

    try
    {
        /* Back camera, so the phone can point at the machine display. */
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    }
    catch (error)
    {
        alert("Camera permission denied or no camera: " + error.message);
        return;
    }

    const video = element("cameraVideo");
    video.srcObject = cameraStream;
    await video.play();

    element("cameraBox").style.display = "block";
    scanIsRunning = true;

    /* Prefer the fast built-in detector; fall back to jsQR. */
    let barcodeDetector = null;

    if ("BarcodeDetector" in window)
    {
        try { barcodeDetector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (error) { barcodeDetector = null; }
    }

    if (!barcodeDetector)
    {
        try { await LoadJsQrLibrary(); }
        catch (error)
        {
            alert(error.message + ". Type the MAC address instead.");
            StopQrScan();
            return;
        }
    }

    const canvas  = document.createElement("canvas");
    const context = canvas.getContext("2d", { willReadFrequently: true });

    const scanOneFrame = async () =>
    {
        if (!scanIsRunning) { return; }

        let qrText = null;

        if (video.readyState >= 2)
        {
            if (barcodeDetector)
            {
                try
                {
                    const codes = await barcodeDetector.detect(video);
                    if (codes.length > 0) { qrText = codes[0].rawValue; }
                }
                catch (error) { /* Try again on the next frame. */ }
            }
            else
            {
                canvas.width  = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const image = context.getImageData(0, 0, canvas.width, canvas.height);
                const code  = window.jsQR(image.data, image.width, image.height);
                if (code) { qrText = code.data; }
            }
        }

        if (qrText !== null)
        {
            const macAddress = ExtractMacAddress(qrText);

            if (macAddress)
            {
                if (navigator.vibrate) { navigator.vibrate(100); }
                StopQrScan();
                SetMasterMacAddress(macAddress, "QR code");
                return;
            }

            Log("QR code found but it has no MAC address: " + qrText, "error");
        }

        requestAnimationFrame(scanOneFrame);
    };

    requestAnimationFrame(scanOneFrame);
}

function StopQrScan()
{
    scanIsRunning = false;

    if (cameraStream)
    {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
    }

    element("cameraVideo").srcObject = null;
    element("cameraBox").style.display = "none";
}

/* ==========================================================================
 *                            STEP 2: ZONE
 * ========================================================================== */

function SelectZone(button)
{
    document.querySelectorAll(".zone-grid button").forEach((otherButton) => otherButton.classList.remove("selected"));
    button.classList.add("selected");

    selectedZoneByte = parseInt(button.dataset.zoneByte, 10);
    Log("Zone " + ZONE_NAMES[selectedZoneByte] + " (byte 0x0" + selectedZoneByte + ")");
    UpdateButtons();
}

/* ==========================================================================
 *                  NODE LINK: WebUSB (Android) or Web Serial (PC)
 * ========================================================================== */

/* WebUSB: talks to the ESP32-C3 USB-Serial/JTAG CDC data interface directly.
 * This is the path that works on Android Chrome. */
class UsbTransport
{
    async Open(onBytes)
    {
        this.device = await navigator.usb.requestDevice({ filters: [{ vendorId: ESPRESSIF_USB_VENDOR_ID }] });
        await this.device.open();

        if (this.device.configuration === null)
        {
            await this.device.selectConfiguration(1);
        }

        /* Find the CDC data interface and its two bulk endpoints. */
        for (const usbInterface of this.device.configuration.interfaces)
        {
            const alternate = usbInterface.alternates[0];

            if (alternate.interfaceClass === CDC_DATA_INTERFACE_CLASS)
            {
                this.interfaceNumber = usbInterface.interfaceNumber;
                this.endpointIn  = alternate.endpoints.find((endpoint) => endpoint.direction === "in").endpointNumber;
                this.endpointOut = alternate.endpoints.find((endpoint) => endpoint.direction === "out").endpointNumber;
            }
        }

        if (this.interfaceNumber === undefined)
        {
            throw new Error("No CDC data interface found on this USB device");
        }

        await this.device.claimInterface(this.interfaceNumber);

        this.isOpen = true;
        this.ReadLoop(onBytes);
    }

    async ReadLoop(onBytes)
    {
        while (this.isOpen)
        {
            try
            {
                const result = await this.device.transferIn(this.endpointIn, USB_READ_CHUNK_BYTES);
                if (result.data && result.data.byteLength > 0)
                {
                    onBytes(new Uint8Array(result.data.buffer));
                }
            }
            catch (error)
            {
                if (this.isOpen) { HandleLinkLost(error); }
                return;
            }
        }
    }

    async Write(bytes)
    {
        await this.device.transferOut(this.endpointOut, bytes);
    }

    async Close()
    {
        this.isOpen = false;
        try { await this.device.releaseInterface(this.interfaceNumber); } catch (error) { /* Already gone. */ }
        try { await this.device.close(); } catch (error) { /* Already gone. */ }
    }
}

/* Web Serial: used on a PC (Chrome / Edge) for bench testing. */
class SerialTransport
{
    async Open(onBytes)
    {
        this.port = await navigator.serial.requestPort({ filters: [{ usbVendorId: ESPRESSIF_USB_VENDOR_ID }] });
        await this.port.open({ baudRate: SERIAL_BAUD_RATE });

        this.writer = this.port.writable.getWriter();
        this.isOpen = true;
        this.ReadLoop(onBytes);
    }

    async ReadLoop(onBytes)
    {
        while (this.isOpen && this.port.readable)
        {
            this.reader = this.port.readable.getReader();

            try
            {
                while (true)
                {
                    const { value, done } = await this.reader.read();
                    if (done) { break; }
                    if (value) { onBytes(value); }
                }
            }
            catch (error)
            {
                if (this.isOpen) { HandleLinkLost(error); }
                return;
            }
            finally
            {
                this.reader.releaseLock();
            }
        }
    }

    async Write(bytes)
    {
        await this.writer.write(bytes);
    }

    async Close()
    {
        this.isOpen = false;
        try { await this.reader.cancel(); } catch (error) { /* Already gone. */ }
        try { this.writer.releaseLock(); } catch (error) { /* Already gone. */ }
        try { await this.port.close(); } catch (error) { /* Already gone. */ }
    }
}

/* ==========================================================================
 *                        LINE PROTOCOL WITH THE NODE
 *   Node provisioning commands end with '\n' and every reply is one line.
 * ========================================================================== */

const textDecoder = new TextDecoder();
const textEncoder = new TextEncoder();

function OnBytesFromNode(bytes)
{
    receiveTextBuffer += textDecoder.decode(bytes, { stream: true });

    let newlineIndex;

    while ((newlineIndex = receiveTextBuffer.indexOf("\n")) >= 0)
    {
        const line = receiveTextBuffer.slice(0, newlineIndex).replace(/\r$/, "").trim();
        receiveTextBuffer = receiveTextBuffer.slice(newlineIndex + 1);

        if (line.length === 0) { continue; }

        Log("< " + line, "received");

        if (line.startsWith("STATUS ")) { ShowNodeStatus(line); }

        /* Hand the line to the first waiter that wants it. */
        const waiterIndex = lineWaiters.findIndex((waiter) => waiter.matches(line));

        if (waiterIndex >= 0)
        {
            const waiter = lineWaiters.splice(waiterIndex, 1)[0];
            clearTimeout(waiter.timer);
            waiter.resolve(line);
        }
    }
}

function WaitForLine(matches, timeoutMilliseconds)
{
    return new Promise((resolve, reject) =>
    {
        const waiter = { matches, resolve };

        waiter.timer = setTimeout(() =>
        {
            lineWaiters = lineWaiters.filter((otherWaiter) => otherWaiter !== waiter);
            reject(new Error("No reply from the node"));
        }, timeoutMilliseconds);

        lineWaiters.push(waiter);
    });
}

/* Send one command and wait for its "OK ..." or "ERR ..." reply. */
async function SendCommand(command, replyStartsWith)
{
    if (!nodeTransport) { throw new Error("Node not connected"); }

    const replyPromise = WaitForLine((line) => line.startsWith(replyStartsWith) || line.startsWith("ERR"),
                                     REPLY_TIMEOUT_MILLISECONDS);

    Log("> " + command, "sent");
    await nodeTransport.Write(textEncoder.encode(command + "\n"));

    const reply = await replyPromise;

    if (reply.startsWith("ERR"))
    {
        throw new Error(reply);
    }

    return reply;
}

function ShowNodeStatus(statusLine)
{
    /* "STATUS id=4 mac=AA:.. ch=1 ths=1 surf=board prov=1 fw=SD_ASNODE_V1.0" */
    const fields = {};

    statusLine.replace(/^STATUS\s+/, "").split(/\s+/).forEach((pair) =>
    {
        const equalsIndex = pair.indexOf("=");
        if (equalsIndex > 0) { fields[pair.slice(0, equalsIndex)] = pair.slice(equalsIndex + 1); }
    });

    const zoneByte = parseInt(fields.id, 10);
    const zoneText = ZONE_NAMES[zoneByte] ? ZONE_NAMES[zoneByte] + " (" + fields.id + ")" : (fields.id || "-") + " (not a zone)";

    const rows = [
        ["Zone",        zoneText],
        ["Master MAC",  fields.mac  || "-"],
        ["Channel",     fields.ch   || "-"],
        ["Mount type",  fields.surf || "-"],
        ["Provisioned", fields.prov === "1" ? "yes" : "no"],
        ["Firmware",    fields.fw   || "-"],
    ];

    const statusBox = element("nodeStatus");
    statusBox.innerHTML = "";

    rows.forEach(([name, value]) =>
    {
        const nameCell  = document.createElement("span");
        const valueCell = document.createElement("span");
        nameCell.textContent  = name;
        valueCell.textContent = value;
        statusBox.appendChild(nameCell);
        statusBox.appendChild(valueCell);
    });

    statusBox.style.display = "grid";
}

/* ==========================================================================
 *                      STEP 4: CONNECT / CONFIGURE
 * ========================================================================== */

async function ConnectNode()
{
    const isAndroid = /Android/i.test(navigator.userAgent);
    let transport;

    /* Android: WebUSB. PC: Web Serial first, WebUSB as a fallback. */
    if (isAndroid && ("usb" in navigator))        { transport = new UsbTransport(); }
    else if ("serial" in navigator)               { transport = new SerialTransport(); }
    else if ("usb" in navigator)                  { transport = new UsbTransport(); }
    else
    {
        SetStatus("connectionStatus", "This browser cannot talk to USB. Use Chrome on Android, or Chrome / Edge on a PC.", "error");
        return;
    }

    try
    {
        receiveTextBuffer = "";
        await transport.Open(OnBytesFromNode);
        nodeTransport = transport;

        SetStatus("connectionStatus", "Connected. Reading node status...", "ok");
        Log("Node connected (" + (transport instanceof UsbTransport ? "WebUSB" : "Web Serial") + ")");
        UpdateButtons();

        /* Opening the port can reboot the node. It comes back in provisioning
         * mode (USB power is present), so give it a moment before asking. */
        await new Promise((resolve) => setTimeout(resolve, 600));
        await ReadNodeStatus();
    }
    catch (error)
    {
        SetStatus("connectionStatus", "Connect failed: " + error.message, "error");
        Log("Connect failed: " + error.message, "error");
        nodeTransport = null;
        UpdateButtons();
    }
}

async function DisconnectNode()
{
    if (nodeTransport)
    {
        const transport = nodeTransport;
        nodeTransport = null;
        await transport.Close();
    }

    lineWaiters.forEach((waiter) => clearTimeout(waiter.timer));
    lineWaiters = [];

    element("nodeStatus").style.display = "none";
    SetStatus("connectionStatus", "Disconnected.", "");
    Log("Node disconnected");
    UpdateButtons();
}

function HandleLinkLost(error)
{
    Log("Link lost: " + error.message, "error");
    nodeTransport = null;
    SetStatus("connectionStatus", "Node disconnected (cable removed?).", "warning");
    UpdateButtons();
}

async function ReadNodeStatus()
{
    try
    {
        await SendCommand("GET STATUS", "STATUS");
        SetStatus("connectionStatus", "Connected.", "ok");
    }
    catch (error)
    {
        SetStatus("connectionStatus", "Connected, but the node did not answer. Is it in provisioning mode?", "warning");
        Log(error.message, "error");
    }
}

async function ConfigureNode()
{
    const channel = parseInt(element("channelSelect").value, 10);
    const surface = element("surfaceSelect").value;

    element("configureButton").disabled = true;
    SetStatus("configureStatus", "Configuring...", "");

    try
    {
        /* Same commands the node firmware already understands. The zone byte
         * travels as the node ID, so the node needs no firmware change. */
        await SendCommand("SET ID " + selectedZoneByte,  "OK id=");
        await SendCommand("SET MAC " + masterMacAddress, "OK mac=");
        await SendCommand("SET CH " + channel,           "OK ch=");
        await SendCommand("SET SURFACE " + surface,      "OK surf=");
        await SendCommand("COMMIT",                      "OK committed");

        /* Read it back so the screen shows what the node really saved. */
        await SendCommand("GET STATUS", "STATUS");

        SetStatus("configureStatus", "Done: " + ZONE_NAMES[selectedZoneByte] + ", channel " + channel + ", " + surface + ". Unplug the node.", "ok");
        if (navigator.vibrate) { navigator.vibrate([80, 60, 80]); }
    }
    catch (error)
    {
        SetStatus("configureStatus", "Failed: " + error.message, "error");
        Log("Configure failed: " + error.message, "error");
    }

    UpdateButtons();
}

/* ==========================================================================
 *                                 SETUP
 * ========================================================================== */

function Setup()
{
    /* Channel list 1..13, last used channel remembered on this phone. */
    const channelSelect = element("channelSelect");

    for (let channel = CHANNEL_MIN; channel <= CHANNEL_MAX; channel++)
    {
        const option = document.createElement("option");
        option.value = channel;
        option.textContent = "Channel " + channel;
        channelSelect.appendChild(option);
    }

    channelSelect.value = StorageGet(localStorage, "channel") || "1";
    channelSelect.addEventListener("change", () => StorageSet(localStorage, "channel", channelSelect.value));

    const surfaceSelect = element("surfaceSelect");
    surfaceSelect.value = StorageGet(localStorage, "surface") || "board";
    surfaceSelect.addEventListener("change", () => StorageSet(localStorage, "surface", surfaceSelect.value));

    /* MAC scanned earlier in this tab (e.g. before a reload). */
    const savedMac = StorageGet(sessionStorage, "masterMacAddress");
    if (savedMac) { SetMasterMacAddress(savedMac, "restored"); }

    element("checkMacButton").addEventListener("click", StartQrScan);
    element("stopCameraButton").addEventListener("click", StopQrScan);

    element("manualMacButton").addEventListener("click", () =>
    {
        const macAddress = ExtractMacAddress(element("manualMacInput").value);
        if (macAddress) { SetMasterMacAddress(macAddress, "typed"); }
        else            { alert("Not a valid MAC address. Use AA:BB:CC:DD:EE:FF."); }
    });

    document.querySelectorAll(".zone-grid button").forEach((button) =>
        button.addEventListener("click", () => SelectZone(button)));

    element("connectButton").addEventListener("click", ConnectNode);
    element("disconnectButton").addEventListener("click", DisconnectNode);
    element("readStatusButton").addEventListener("click", ReadNodeStatus);
    element("configureButton").addEventListener("click", ConfigureNode);

    if (navigator.usb)
    {
        navigator.usb.addEventListener("disconnect", () => { if (nodeTransport instanceof UsbTransport) { HandleLinkLost(new Error("USB device removed")); } });
    }

    UpdateButtons();
}

Setup();
</script>
</body>
</html>
